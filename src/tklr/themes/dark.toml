# tklr built-in theme: dark (the default).
# Every key is set here; other themes name base = "dark" and override some.
name = "dark"
dark = true
textual = "textual-dark"   # Textual theme used for Textual's own widgets

[ui]
background = "#373737"
foreground = "#ffffff"
text = "#e0e0e0"
list_text = "white"   # Rich/terminal white, as before
muted = "#cccccc"
rule = "#7f7f7f"
dim_rule = "#555555"
accent = "#32cd32"
emphasis = "#ffff00"
surface = "#373737"
message_background = "#373737"
input_background = "#3a3a3a"
input_border = "#7f7f7f"
highlight = "#2e2e2e"

[palette]
label_color = "lightskyblue"
type_color = "goldenrod"
at_color = "goldenrod"
am_color = "goldenrod"
header_color = "lemonchiffon"
event_color = "limegreen"
available_color = "lightskyblue"
task_color = "lightskyblue"
waiting_color = "darkgray"
finished_color = "gray"
note_color = "darksalmon"
pastdue_color = "darkorange"
notice_color = "gold"
goal_color = "palegoldenrod"
draft_color = "orangered"
bin_color = "goldenrod"
active_bin_color = "gold"
chore_color = "khaki"
jot_color = "deepskyblue"
jot_none = "deepskyblue"
jot_extent = "orchid"
jot_use = "goldenrod"
jot_full = "palegreen"
urgency_min_color = "lightskyblue"
urgency_max_color = "yellow"
goal_min_color = "lightskyblue"
goal_max_color = "yellow"
title_color = "cornsilk"
footer_color = "#ff8c00"
dim_style = "dim"
busy_color = "green"
conflict_color = "red"
allday_color = "#ffbf00"
busy_header_color = "lemonchiffon"
match_color = "gold"
status_info = "white"
status_warning = "yellow"
status_error = "red"

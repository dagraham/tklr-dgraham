# tklr built-in theme: light.
# Every key is set here; other themes name base = "light" and override some.
name = "light"
dark = false
# Kept on textual-dark so Textual's own widgets look as they always have;
# a light theme of your own can set textual = "textual-light".
textual = "textual-dark"

[ui]
background = "#f7f7f7"
foreground = "#1f1f1f"
text = "#1f1f1f"
list_text = "#1f1f1f"
muted = "#4a4a4a"
rule = "#c7c7c7"
dim_rule = "#b0b0b0"
accent = "#1f7a1f"
emphasis = "#1f1f1f"
surface = "#fdfdfd"
message_background = "#f2f2f2"
input_background = "#ffffff"
input_border = "#a0a0a0"
highlight = "#eaeaea"

